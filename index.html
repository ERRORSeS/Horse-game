<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxer to Oxer Stable Manager</title>
  <link rel="stylesheet" href="styles.css?v=22" />
  <link rel="stylesheet" href="veterinary3.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="topbar-heading"><h1>Oxer to Oxer Stable Manager</h1><button id="toggleTabsBtn" class="tabs-toggle" type="button" aria-controls="tabs" aria-expanded="true">Hide Tabs ▴</button></div>
    <div class="status">
      <span id="monthLabel" aria-live="polite"></span>
      <span id="moneyLabel" aria-live="polite" aria-atomic="true"></span>
      <button id="skipMonthBtn" type="button">Skip Month</button>
      <button id="skipDayBtn" type="button">Skip Day</button>
      <button id="skipHourBtn" type="button">Skip Hour</button>
      <button id="addMoneyBtn" type="button">Add $100,000</button>
      <button id="toggleSavePanelBtn" type="button" aria-controls="savePanel" aria-expanded="false">Save/Load ▾</button>
      <div id="savePanel" class="save-panel hidden" aria-hidden="true">
        <input id="saveNameInput" type="text" placeholder="Save name" aria-label="Save game name" />
        <select id="saveSlotSelect" aria-label="Saved games list"></select>
        <button id="saveGameBtn" type="button">Save Game</button>
        <button id="loadGameBtn" type="button">Load Game</button>
        <button id="deleteSaveBtn" type="button">Delete Save</button>
      </div>
      <button id="resetGameBtn" type="button">Reset Game</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <section id="dashboard" class="panel"></section>
    <section id="horses" class="panel hidden"></section>
    <section id="barn" class="panel hidden"></section>
    <section id="market" class="panel hidden"></section>
    <section id="sales" class="panel hidden"></section>
    <section id="stud" class="panel hidden"></section>
    <section id="shows" class="panel hidden"></section>
    <section id="vet" class="panel hidden"></section>
    <section id="farrier" class="panel hidden"></section>
    <section id="training" class="panel hidden"></section>
    <section id="breeding" class="panel hidden"></section>
    <section id="registries" class="panel hidden"></section>
    <section id="breeders" class="panel hidden"></section>
    <section id="freezer" class="panel hidden"></section>
    <section id="rescue" class="panel hidden"></section>
    <section id="calendar" class="panel hidden"></section>
    <section id="settings" class="panel hidden"></section>
  </main>

  <template id="horseCardTemplate">
    <article class="horse-card">
      <h3 class="horse-name"></h3>
      <p class="subline"></p>
      <p class="meta"></p>
      <div class="grid two">
        <div>
          <h4>Jump Training</h4>
          <ul class="stats jump-stats"></ul>
        </div>
        <div>
          <h4>Dressage Training</h4>
          <ul class="stats dressage-stats"></ul>
        </div>
      </div>
      <div class="grid two">
        <div class="results"></div>
        <div class="manage"></div>
      </div>
    </article>
  </template>

  <script src="pasture.js?v=2"></script>
  <script src="management.js?v=23"></script>
  <script src="stalls.js?v=2"></script>
  <script src="tack.js?v=2"></script>
  <script src="fitting.js?v=1"></script>
  <script src="competition-equipment.js?v=1"></script>
  <script src="calendar-equipment.js?v=2"></script>
  <script src="behavior.js?v=1"></script>
  <script src="script.js?v=23"></script>
  <script src="care-fixes.js?v=3"></script>
  <script src="calendar-expansion.js?v=1"></script>
  <script src="training2.js?v=progression-8"></script>
  <script src="training2-extension.js?v=2"></script>
  <script src="training2-fixes.js?v=3"></script>
  <script src="auto-training-fix.js?v=2"></script>
  <script src="discipline-progression.js?v=1"></script>
  <script src="training-roster-fix.js?v=1"></script>
  <script src="medical-catalog.js?v=25"></script>
  <script src="health-engine.js?v=29"></script>
  <script src="sales-engine.js?v=29"></script>
  <script src="care-sales.js?v=29"></script>
  <script src="care-shops.js?v=23"></script>
  <script src="sales-ui.js?v=23"></script>
  <script src="medical-ui.js?v=25"></script>
  <script src="save-fix.js?v=29"></script>
  <script src="browser-inputs.js?v=23"></script>
  <script src="critical-ui.js?v=29"></script>
  <script src="veterinary3-ui.js?v=1"></script>
  <script src="ui-state.js?v=23"></script>
</body>
</html>
